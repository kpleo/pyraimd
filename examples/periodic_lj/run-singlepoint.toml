schema_version = 1

[run]
id = "lj-singlepoint"
directory = "runs/lj-singlepoint"
seed = 42

[task]
kind = "singlepoint"
mode = "surrogate"

[structure]
file = "structure.extxyz"

[dynamics]
timestep_fs = 0.5
steps = 1

[surrogate]
backend = "lj_surrogate"
softening = 0.95

[relax]
optimizer = "fire"
fmax_eV_A = 0.05
steps = 100
