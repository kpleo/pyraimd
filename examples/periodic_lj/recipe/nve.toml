# Serial recipe stage 3: fixed-surrogate NVE continuing the NVT boundary.
# The complete momenta carry over (no rethermalization); NVE has no bath
# settings by construction.
schema_version = 1

[run]
id = "lj-nve"
directory = "nve"
seed = 42

[task]
kind = "md"
mode = "surrogate"

[structure]
file = "nve/initial.traj"

[dynamics]
ensemble = "nve"
timestep_fs = 2.0
steps = 12
temperature_K = 40.0
velocity_seed = 7

[surrogate]
backend = "lj_surrogate"
softening = 0.95

[checkpoint]
interval_steps = 4

[output]
trajectory_interval_steps = 1
summary_interval_steps = 4
