schema_version = 1

[run]
id = "al-run-singlepoint"
directory = "runs/al-run-singlepoint"
seed = 42

[task]
kind = "singlepoint"
mode = "surrogate"

[structure]
file = "structure.extxyz"

[dynamics]
timestep_fs = 0.5
steps = 1

[surrogate]
backend = "mace"
model = "./mace-mpa-0-medium.model"
device = "cpu"
default_dtype = "float64"

[relax]
optimizer = "fire"
fmax_eV_A = 0.05
steps = 100

[constraints]
fix_atoms_indices = [0, 1, 2, 3, 4, 5, 6, 7]
