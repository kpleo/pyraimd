[project]
name = "pyraimd2-harmonic"
version = "0.1.0"
description = "Example pyraimd2 backend plugin: analytic harmonic reference and surrogate"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "ase>=3.29.0",
    "pyraimd2",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

# Third-party backends plug into pyraimd2 without touching the core: the
# registry discovers these entry points and the factories below build the
# backend objects. Kind is declared on each factory (backend_kind).
[project.entry-points."pyraimd2.backends"]
harmonic_reference = "pyraimd2_harmonic:reference_factory"
harmonic_surrogate = "pyraimd2_harmonic:surrogate_factory"
